<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voqcl</title>
<style>
  :root { --surface:rgba(10,10,10,.88); --fg:#fff; --muted:#8a8a8a; --line:#2c2c2c; }
  * { box-sizing:border-box; margin:0; padding:0; }

  /* ===== CUSTOM BACKGROUND =====
     Put your image next to this file as bg.jpg (or change the file name below).
     You can also swap the whole line for a color, e.g.  background: #222;  or a video/gradient. */
  body {
    min-height:100vh; display:grid; place-items:center; padding:24px 16px;
    background: url('bg.png') center / cover no-repeat fixed #1a1a1a;
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }

  /* ===== CARD ===== */
  .card { position:relative; width:100%; max-width:380px; padding:1px; border-radius:33px; overflow:hidden; animation:rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .card::before { content:""; position:absolute; inset:-60%; background:conic-gradient(from 0deg, transparent 0 72%, rgba(255,255,255,.9) 86%, transparent 100%); animation:spin 7s linear infinite; }
  .card::after { content:""; position:absolute; inset:0; border-radius:inherit; border:1px solid var(--line); pointer-events:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes rise { from{opacity:0;transform:translateY(14px) scale(.98)} to{opacity:1;transform:none} }

  .inner { position:relative; border-radius:32px; background:var(--surface); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); padding:34px 18px 18px; overflow:hidden; --mx:50%; --my:0%; }
  .inner::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .4s; background:radial-gradient(220px circle at var(--mx) var(--my), rgba(255,255,255,.08), transparent 70%); }
  .inner:hover::before { opacity:1; }

  /* ===== PROFILE ===== */
  header { position:relative; text-align:center; margin-bottom:26px; }
  .pfp { position:relative; width:100px; height:100px; margin:0 auto 16px; border-radius:50%; padding:4px; transition:transform .4s cubic-bezier(.2,.7,.2,1); }
  .pfp:hover { transform:scale(1.06) rotate(-2deg); }
  .pfp .ring { position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 0deg, #2a2a2a, #fff, #2a2a2a 50%, #fff, #2a2a2a); animation:spin 9s linear infinite; }
  .pfp .circle { position:relative; width:100%; height:100%; border-radius:50%; overflow:hidden; background:#111; border:3px solid #0a0a0a; }
  .pfp img { width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(1) contrast(1.05); /* delete this filter to show your pfp in color */ }
  .pfp .fallback { position:absolute; inset:4px; display:none; place-items:center; border-radius:50%; background:#111; border:3px solid #0a0a0a; font-size:36px; font-weight:600; }
  .pfp.empty img { display:none; } .pfp.empty .fallback { display:grid; }
  h1 { font-size:32px; font-weight:600; letter-spacing:-.05em; line-height:1; }
  .sub { margin-top:8px; display:inline-block; padding:4px 12px; border:1px solid var(--line); border-radius:999px; font-size:12px; color:var(--muted); }

  /* ===== SOCIAL LINKS — edit href values ===== */
  .links { position:relative; list-style:none; display:grid; gap:8px; }
  .links li { opacity:0; animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
  .links li:nth-child(1){animation-delay:.25s} .links li:nth-child(2){animation-delay:.32s}
  .links li:nth-child(3){animation-delay:.39s} .links li:nth-child(4){animation-delay:.46s}
  .links li:nth-child(5){animation-delay:.53s}
  .links a { display:flex; align-items:center; gap:12px; padding:8px 16px 8px 8px; background:#000; border:1px solid var(--line); border-radius:999px; color:var(--fg); text-decoration:none; font-size:14px; font-weight:500; letter-spacing:-.01em; transition:border-color .3s, background .3s, color .3s, transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s; }
  .links .icon { display:grid; place-items:center; flex:none; width:34px; height:34px; border:1px solid var(--line); border-radius:50%; transition:background .3s, color .3s, border-color .3s, transform .4s cubic-bezier(.2,.7,.2,1); }
  .links svg { width:15px; height:15px; fill:currentColor; }
  .links svg.stroke { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .links .name { flex:1; }
  .links .arrow { width:15px; height:15px; color:var(--muted); opacity:0; transform:translate(-6px,6px); transition:transform .3s, opacity .3s, color .3s; }
  .links a:hover, .links a:focus-visible { background:var(--fg); color:#000; border-color:var(--fg); transform:translateY(-2px) scale(1.01); box-shadow:0 8px 30px rgba(255,255,255,.12); outline:none; }
  .links a:hover .icon, .links a:focus-visible .icon { background:#000; color:var(--fg); border-color:#000; transform:rotate(-8deg) scale(1.05); }
  .links a:hover .arrow, .links a:focus-visible .arrow { opacity:1; transform:none; color:#444; }
  .links a:active { transform:scale(.98); }

  @media (prefers-reduced-motion:reduce) { *, *::before { animation:none !important; transition:none !important; } .links li { opacity:1; } }
</style>
</head>
<body>

      <header>

        <div class="pfp" id="pfp">

  </main>

  <script>
    // cursor spotlight inside the card
    (function () {
      var el = document.getElementById('inner');
      el.addEventListener('pointermove', function (e) {
        var r = el.getBoundingClientRect();
        el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        el.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
    })();
  </script>

</html>
