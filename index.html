<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0b0c;--card:#151516;--c2:#1c1c1e;--line:#2a2a2d;--tx:#f4f4f5;--mu:#8e8e93;--ac:#fff}

*{box-sizing:border-box}

::-webkit-scrollbar-thumb{background:#303033;border-radius:8px;border:3px solid #000}::-webkit-scrollbar-thumb:hover{background:#555}
body{margin:0;background:radial-gradient(900px 400px at 50% -10%,#232325,transparent),var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#0b0b0cdd;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:12px 20px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.18em;font-size:15px}.logo b{color:#000;background:#fff;padding:2px 7px;border-radius:5px;margin-right:6px;letter-spacing:0}

h1{font-size:28px;margin:0 0 6px}h2{font-size:12px;letter-spacing:.14em;color:var(--mu);margin:30px 0 12px;text-transform:uppercase}

input,textarea,select{width:100%}input[type=range]{padding:0}input[type=color]{padding:2px;height:36px}
label{display:block;color:var(--mu);font-size:12px;margin:10px 0 4px}

.two>*{min-width:0}.two{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

.note{background:#101011;border:1px dashed #444;border-radius:10px;padding:10px;color:#bbb;font-size:13px;margin-top:12px}
.err{color:#ff8a8a}.big{font-size:clamp(28px,10vw,56px);font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.checker{background:repeating-conic-gradient(#2a2a2a 0 25%,#1a1a1a 0 50%) 0 0/20px 20px;border-radius:10px;overflow:auto}

.tile:hover .tb{opacity:1}.tb button{padding:2px 8px;background:#000c;font-size:12px}.tb span{margin-right:auto;background:#000c;padding:2px 8px;border-radius:6px;font-size:12px}

.lv{text-align:center;padding:10px;width:100%;max-width:720px;margin:auto}.avw{width:112px;height:112px;margin:0 auto 14px;position:relative}.av{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 40px #ffffff40;display:block}.av.ph{display:grid;place-items:center;font-size:44px;font-weight:900;background:#111}.avw .av[hidden]{display:none}

</style></head><body>
<header><a href="#/" class="logo"><b>V</b>VOQCL TOOLS</a>
<nav id="nav"><a href="#/">Home</a><a href="#/tools">Tools</a><a href="#/c/obs">OBS</a><a href="#/tool/multiview">Multiview</a><a href="#/c/util">Utilities</a><a href="#/c/creator">Creator Tools</a><a href="#/c/yt">YouTube</a><a href="#/c/dev">Code</a><a href="#/c/text">Text</a></nav></header>
<main id="app"></main>
<script>
/* ===== core.js ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=[];const CLEAN=[];const runClean=()=>{while(CLEAN.length)CLEAN.pop()()};const tm=(f,ms)=>{const i=setInterval(f,ms);CLEAN.push(()=>clearInterval(i))};const on=(t,e,f)=>{t.addEventListener(e,f);CLEAN.push(()=>t.removeEventListener(e,f))};
const rerun=el=>{runClean();const t=T.find(x=>x.id===el.dataset.tool);el.innerHTML='';t.fn(el)};
const LS={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const copy=async(t,b)=>{try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}if(b){const o=b.textContent;b.textContent='Copied ✓';setTimeout(()=>b.textContent=o,1200)}};
const dl=(name,data,type)=>{const u=data instanceof Blob?URL.createObjectURL(data):URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const page=(t,d,body)=>`<h1>${t}</h1><p class="d">${d}</p>${body}`;
const OBSNOTE=`<div class="note"><b>OBS setup:</b> Export the overlay file, then in OBS add <b>Sources → Browser</b>, tick <b>Local file</b> and select the downloaded .html. Set width/height to match your canvas (e.g. 1920×1080) and leave the custom CSS empty. The page background is transparent.</div>`;
const overlayDoc=(inner,js='')=>`<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}@keyframes rise{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-240px) scale(1.4);opacity:0}}.em{position:absolute;bottom:0;font-size:48px;animation:rise 2.2s ease-out forwards}</style></head><body>${inner}<script>${js}<\/script></body></html>`;
const loadImg=(file,cb,er)=>{const i=new Image();i.onload=()=>cb(i);i.onerror=()=>er('Could not read that image.');i.src=URL.createObjectURL(file)};
/* ===== tools.js ===== */
const add=(id,cat,ic,name,desc,fn,tag)=>T.push({id,cat,ic,name,desc,fn,tag});

add('follow','obs','♥','Goal Bar (manual)','Follower / sub / donation goal bar you update by hand, with OBS overlay export.',el=>{
 let f=LS.g('f.s',{label:'Followers',cur:0,goal:100,color:'#ffffff',bg:'#1c1c1e',w:520});
 const bar=f=>{const p=Math.min(100,f.goal>0?f.cur/f.goal*100:0);return`<div style="width:${f.w}px;max-width:100%;padding:14px 18px;background:${f.bg}e6;border:1px solid #fff3;border-radius:14px"><div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px"><span>${esc(f.label)}</span><span>${f.cur} / ${f.goal}</span></div><div style="height:14px;background:#000a;border-radius:99px;overflow:hidden"><div style="width:${p}%;height:100%;background:${f.color};border-radius:99px;transition:width .5s"></div></div></div>`};
 el.innerHTML=page('Goal Bar','Use for follower, subscriber, donation or stream goals. Update the count manually while live.',`<div class="two"><div class="panel">
 <label>Label</label><input id="a" value="${esc(f.label)}"><label>Current</label><input id="b" type="number" value="${f.cur}"><label>Goal</label><input id="c" type="number" min="1" value="${f.goal}">
 <label>Bar colour</label><input id="d" type="color" value="${f.color}"><label>Background</label><input id="e" type="color" value="${f.bg}"><label>Width (px)</label><input id="w" type="number" value="${f.w}">
 <div class="row"><button id="m">−1</button><button id="p" class="pri">+1</button><button id="p10">+10</button><button id="rs">Reset</button></div></div>
 <div><div class="panel checker" style="padding:30px" id="pv"></div><div class="row"><button class="pri" id="ex">Download OBS overlay</button><button id="cp">Copy overlay HTML</button></div>${OBSNOTE}</div></div>`);
 const up=()=>{f={label:$('#a').value||'Goal',cur:+$('#b').value||0,goal:Math.max(1,+$('#c').value||1),color:$('#d').value,bg:$('#e').value,w:Math.max(200,+$('#w').value||520)};LS.s('f.s',f);$('#pv').innerHTML=bar(f)};
 $$('input',el).forEach(i=>i.oninput=up);
 const bump=n=>{$('#b').value=Math.max(0,(+$('#b').value||0)+n);up()};
 $('#p').onclick=()=>bump(1);$('#m').onclick=()=>bump(-1);$('#p10').onclick=()=>bump(10);
 $('#rs').onclick=()=>{f={label:'Followers',cur:0,goal:100,color:'#ffffff',bg:'#1c1c1e',w:520};LS.s('f.s',f);rerun(el)};
 const doc=()=>overlayDoc(`<div style="padding:10px">${bar(f)}</div>`);
 $('#ex').onclick=()=>dl('voqcl-goal-overlay.html',doc(),'text/html');$('#cp').onclick=e=>copy(doc(),e.target);up()});

add('emote','obs','☺','Emote Overlay','Floating emote bursts for your stream. Preview, then export for OBS.',el=>{
 el.innerHTML=page('Emote Overlay','Choose emotes or upload your own image. Bursts rise from the bottom of the screen.',`<div class="two"><div class="panel">
 <label>Emotes (separate with spaces)</label><input id="a" value="🔥 💜 😂 🎉 ⭐"><label>Or upload an emote image</label><input id="f" type="file" accept="image/*">
 <label>Burst size</label><input id="n" type="range" min="1" max="20" value="6"><label>Auto-burst every (seconds, export)</label><input id="s" type="number" min="1" value="8">
 <div class="row"><button class="pri" id="b">Burst!</button><button id="rs">Reset</button></div></div>
 <div><div class="panel checker" id="st" style="position:relative;height:300px;overflow:hidden"></div><div class="row"><button class="pri" id="ex">Download OBS overlay</button><button id="cp">Copy overlay HTML</button></div>
 <div class="note">Overlays are static files: they fire on a timer instead of reacting to live chat. Live chat triggers need a server, which this site doesn't have.</div>${OBSNOTE}</div></div>`);
 let img=null;const items=()=>img?[`<img src="${img}" style="height:48px">`]:$('#a').value.split(/\s+/).filter(Boolean).map(esc);
 const burst=()=>{const L=items();if(!L.length)return;for(let i=0;i<+$('#n').value;i++){const s=document.createElement('span');s.className='em';s.style.left=Math.random()*90+'%';s.style.animationDelay=Math.random()*.6+'s';s.innerHTML=L[i%L.length];$('#st').append(s);setTimeout(()=>s.remove(),3200)}};
 $('#b').onclick=burst;$('#rs').onclick=()=>{img=null;rerun(el)};
 $('#f').onchange=e=>{const r=new FileReader();const f=e.target.files[0];if(!f)return;r.onload=()=>img=r.result;r.readAsDataURL(f)};
 const doc=()=>overlayDoc('<div id="s"></div>',`const L=${JSON.stringify(items())},n=${+$('#n').value};function b(){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='em';s.style.left=Math.random()*90+'%';s.style.animationDelay=Math.random()*.6+'s';s.innerHTML=L[i%L.length];document.body.append(s);setTimeout(()=>s.remove(),3200)}}b();setInterval(b,${Math.max(1,+$('#s').value||8)*1000});`);
 $('#ex').onclick=()=>dl('voqcl-emote-overlay.html',doc(),'text/html');$('#cp').onclick=e=>copy(doc(),e.target)});

add('mask','creator','◐','Mask / Webcam Shape','Make a transparent webcam frame mask in any shape. Download as PNG.',el=>{
 el.innerHTML=page('Mask / Webcam Shape Generator','Creates a frame PNG with a transparent shape cut-out. Layer it over your webcam, or use it as an Image Mask in OBS.',`<div class="two"><div class="panel">
 <label>Shape</label><select id="sh"><option>circle</option><option>rounded</option><option>hexagon</option><option>diamond</option><option>star</option><option>heart</option><option>triangle</option></select>
 <label>Width</label><input id="w" type="number" value="640"><label>Height</label><input id="h" type="number" value="640"><label>Corner radius (rounded)</label><input id="r" type="range" min="0" max="50" value="20">
 <label>Padding (%)</label><input id="p" type="range" min="0" max="30" value="4"><label>Frame colour</label><input id="c" type="color" value="#000000"><label><input type="checkbox" id="i" style="width:auto"> Invert (shape filled, outside transparent)</label>
 <div class="row"><button class="pri" id="d">Download PNG</button><button id="rs">Reset</button></div></div><div class="panel checker"><canvas id="cv"></canvas></div></div>`);
 const path=(x,t,w,h,p,r)=>{const cx=w/2,cy=h/2,rx=cx-w*p/100,ry=cy-h*p/100;x.beginPath();
  if(t==='circle')x.ellipse(cx,cy,rx,ry,0,0,7);
  else if(t==='rounded'){const k=Math.min(rx,ry)*r/50;x.roundRect(cx-rx,cy-ry,rx*2,ry*2,k)}
  else if(t==='triangle'){x.moveTo(cx,cy-ry);x.lineTo(cx+rx,cy+ry);x.lineTo(cx-rx,cy+ry);x.closePath()}
  else if(t==='heart'){x.moveTo(cx,cy+ry);x.bezierCurveTo(cx-rx*1.6,cy-ry*.1,cx-rx*.7,cy-ry*1.2,cx,cy-ry*.35);x.bezierCurveTo(cx+rx*.7,cy-ry*1.2,cx+rx*1.6,cy-ry*.1,cx,cy+ry);x.closePath()}
  else{const n=t==='hexagon'?6:t==='diamond'?4:10;for(let i=0;i<n;i++){const a=Math.PI*2*i/n-Math.PI/2+(t==='hexagon'?Math.PI/6:0),k=t==='star'&&i%2?.45:1;x[i?'lineTo':'moveTo'](cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k)}x.closePath()}};
 const draw=()=>{const cv=$('#cv'),w=Math.min(2000,Math.max(32,+$('#w').value||640)),h=Math.min(2000,Math.max(32,+$('#h').value||640));cv.width=w;cv.height=h;const x=cv.getContext('2d'),inv=$('#i').checked;
  x.fillStyle=$('#c').value;if(!inv)x.fillRect(0,0,w,h);path(x,$('#sh').value,w,h,+$('#p').value,+$('#r').value);if(inv)x.fill();else{x.globalCompositeOperation='destination-out';x.fill()}};

add('multiview','util','▦','Multiview','Watch multiple Twitch & YouTube streams side by side, with chat.',el=>{

 const KIND={twitch:'Twitch live',tvod:'Twitch VOD',tclip:'Twitch clip',yt:'YouTube video / live',ytlive:'YouTube channel live',ytuser:'YouTube uploads',ytlist:'YouTube playlist',kick:'Kick'};

 const RES=/^(directory|videos|p|downloads|settings|subscriptions|turbo|jobs|store|friends|wallet|inventory|drops|prime|search|login|signup|u|popout|embed|moderator|team)$/i;
 const HANDLE='YouTube @handles can’t be embedded directly. Paste a video/live link, or a channel link of the form youtube.com/channel/UC… (find it in the channel’s About → Share → Copy channel ID).';
 /* ---- parsing ---- */
 const parse=(raw,force='')=>{let s=raw.trim();if(!s)return{err:'Empty'};
  const m0=s.match(/^(twitch|yt|youtube|kick):(.+)$/i);if(m0){force=m0[1].toLowerCase().replace('youtube','yt');s=m0[2].trim()}
  const tw=n=>/^\w{1,25}$/.test(n)&&!RES.test(n)?{p:'twitch',id:n.toLowerCase()}:{err:'Not a valid Twitch channel name'};
  let m;const url=/(twitch\.tv|youtube\.com|youtu\.be|youtube-nocookie\.com|kick\.com)/i.test(s)||/^https?:\/\//i.test(s)||/\w\.\w{2,}\//.test(s);

   if(m=s.match(/clips\.twitch\.tv\/(?:embed\?clip=)?([\w-]+)/i)||s.match(/twitch\.tv\/\w+\/clip\/([\w-]+)/i))return{p:'tclip',id:m[1]};
   if(m=s.match(/twitch\.tv\/(?:popout\/)?([\w]+)/i))return tw(m[1]);
   if(m=s.match(/kick\.com\/([\w-]+)/i))return/^[\w-]{1,25}$/.test(m[1])?{p:'kick',id:m[1].toLowerCase()}:{err:'Not a valid Kick channel'};
   if(/youtu\.?be/i.test(s)){
    if(m=s.match(/youtu\.be\/([\w-]{11})/i)||s.match(/[?&]v=([\w-]{11})/)||s.match(/youtube(?:-nocookie)?\.com\/(?:live|shorts|embed|v)\/([\w-]{11})/i))return{p:'yt',id:m[1]};

    if(m=s.match(/\/user\/([\w.-]+)/i))return{p:'ytuser',id:m[1]};
    if(/\/(@|c\/)/i.test(s))return{err:HANDLE};
    return{err:'Could not find a video or channel in that YouTube link'}}
   return{err:'Only Twitch, YouTube and Kick links are supported'}}
  if(force==='yt'||(!force&&(/^UC[\w-]{22}$/.test(s)||(/^[\w-]{11}$/.test(s)&&s.includes('-')))||/^@/.test(s))){
   if(/^UC[\w-]{22}$/.test(s))return{p:'ytlive',id:s};if(/^[\w-]{11}$/.test(s))return{p:'yt',id:s};

 const src=s=>{const m=s.m!==false,t=m?'true':'false';switch(s.p){

const DEC='https://decapi.me/twitch/';
const decTxt=async p=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(DEC+p,{signal:c.signal});if(!r.ok)throw new Error('Service returned '+r.status);return(await r.text()).trim()}finally{clearTimeout(t)}};
function liveView(box,ch,overlay){
 const key='live.'+ch;let hist=LS.g(key,[]).filter(p=>Date.now()-p[0]<16*36e5),av='',cur=null,err='';
 box.innerHTML=`<div class="lv"><div class="avw"><img class="av" alt="" hidden><div class="av ph">${esc(ch[0].toUpperCase())}</div></div><div class="nm">${esc(ch)}</div><div class="cnt">…</div><div class="lb">Followers</div><div class="err lerr"></div><div class="chart" ${overlay?'hidden':''}></div></div>`;
 const q=s=>$(s,box),img=q('img.av');img.onerror=()=>{img.hidden=true;q('.ph').hidden=false};img.onload=()=>{img.hidden=false;q('.ph').hidden=true};
 const chart=()=>{if(hist.length<2){return`<div style="color:var(--mu);text-align:center;font-size:12px">Collecting history… (updates every 15s)</div>`}
  const W=700,H=150,v=hist.map(p=>p[1]),mn=Math.min(...v),mx=Math.max(...v),lo=mn===mx?mn-1:mn,hi=mn===mx?mx+1:mx,t0=hist[0][0],t1=hist[hist.length-1][0],xs=t=>(t-t0)/Math.max(1,t1-t0)*W,ys=n=>H-(n-lo)/(hi-lo)*(H-12)-6;
  const pts=hist.map(p=>xs(p[0]).toFixed(1)+','+ys(p[1]).toFixed(1)).join(' '),gain=v[v.length-1]-v[0],hrs=Math.max(0,(t1-t0)/36e5),span=hrs<1?Math.max(1,Math.round(hrs*60))+'m':hrs.toFixed(1)+'h',f=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  return`<div class="row" style="justify-content:space-between;margin:0 0 6px;font-size:12px;color:var(--mu)"><span><b style="color:#fff">${gain>0?'+':gain<0?'−':'±'}${Math.abs(gain)}</b> followers gained</span><span>last ${span}</span></div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:150px;display:block"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><polygon points="0,${H} ${pts} ${W},${H}" fill="url(#g)"/><polyline points="${pts}" fill="none" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="row" style="justify-content:space-between;margin:4px 0 0;font-size:11px;color:var(--mu)"><span>${f(t0)}</span><span>${f(t1)}</span></div>`};
 const paint=()=>{if(!box.isConnected||!q('.cnt'))return;q('.cnt').textContent=cur==null?(err?'—':'…'):cur.toLocaleString();q('.lerr').textContent=err?err+' · retrying…':'';if(!overlay)q('.chart').innerHTML=chart()};
 const poll=async()=>{try{if(!av){try{const a=await decTxt('avatar/'+ch);if(/^https?:\/\//.test(a)){av=a;img.src=a}}catch(e){}}
  const t=await decTxt('followcount/'+ch);if(!/^\d+$/.test(t))throw new Error(/not found|no user|invalid/i.test(t)?'Channel not found':(t.slice(0,60)||'Unexpected response'));
  cur=+t;err='';hist.push([Date.now(),cur]);hist=hist.slice(-1500);LS.s(key,hist)}catch(e){err=e.name==='AbortError'?'Request timed out':e.message==='Failed to fetch'?'Could not reach the follower service':e.message}paint()};
 paint();poll();tm(poll,15000)}
